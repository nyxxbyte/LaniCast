<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Warm Atmosphere — Weather</title>
  <style>
    :root {
      --bg-cream: #F8F4EE;
      --surface-card: #FFFDF9;
      --terracotta: #C85A32;
      --text-main: #2D231F;
      --text-muted: #726259;
      --border-warm: #E6DCD1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: sans-serif;
      background-color: var(--bg-cream);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .app-wrapper {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    h1 { text-align: center; font-size: 1.8rem; }
    .search-card {
      display: flex;
      gap: 0.5rem;
    }
    .search-input {
      flex: 1;
      padding: 0.8rem;
      border: 1px solid var(--border-warm);
      border-radius: 8px;
      font-size: 1rem;
    }
    .search-btn {
      background-color: var(--terracotta);
      color: white;
      border: none;
      padding: 0.8rem 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
    }
    .weather-card {
      background: var(--surface-card);
      border: 1px solid var(--border-warm);
      border-radius: 20px;
      padding: 2rem;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }
    .temp-display {
      font-size: 4rem;
      font-weight: bold;
      margin: 1rem 0;
    }
    .weather-icon { width: 100px; }
    .error-card {
      background: #FBEBE8;
      color: #962D1D;
      padding: 1rem;
      border-radius: 8px;
      text-align: center;
    }
  </style>
</head>
<body>

  <main class="app-wrapper">
    <h1>Atmosphere</h1>

    <form class="search-card" method="get">
      <input 
        type="text" 
        name="city" 
        class="search-input" 
        placeholder="Enter city name..." 
        value="{% if weather.city %}{{ weather.city }}{% else %}{{ city }}{% endif %}"
        required
      />
      <button type="submit" class="search-btn">Search</button>
    </form>

    {% if weather.error %}
      <div class="error-card">{{ weather.error }}</div>
    {% else %}
      <section class="weather-card">
        <h2>{{ weather.city }}, {{ weather.country }}</h2>
        <img class="weather-icon" src="https://openweathermap.org/img/wn/{{ weather.icon }}@4x.png" alt="icon" />
        <div class="temp-display">{{ weather.temp }}°C</div>
        <p>{{ weather.description }}</p>
        <p style="margin-top: 1rem; color: var(--text-muted);">
          Humidity: {{ weather.humidity }}% | Wind: {{ weather.wind_speed }} km/h
        </p>
      </section>
    {% endif %}
  </main>

</body>
</html>
